spring.application.name=nibiru-home

spring.datasource.url=jdbc:mariadb://localhost:3306/nibiru-home
spring.datasource.username=nibiruHome
spring.datasource.password=nibiruHome
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=none

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
# CORS local (comentado para entorno servidor)
# app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
# CORS remoto (activo)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://nibiruhome.store,https://nibiruhome.store,http://admin.nibiruhome.store,https://admin.nibiruhome.store,http://www.nibiruhome.store,https://www.nibiruhome.store}
server.forward-headers-strategy=framework
spring.mvc.async.request-timeout=0
bank.integration.base-url=${BANK_INTEGRATION_BASE_URL:http://api.bank.nibiruhome.store}
bank.integration.login=${BANK_INTEGRATION_LOGIN:Marta}
bank.integration.api-token=${BANK_INTEGRATION_API_TOKEN:token1}
bank.integration.destination-iban=${BANK_INTEGRATION_DESTINATION_IBAN:ES33 0081 5220 0001 2345 6789}
bank.integration.concept=${BANK_INTEGRATION_CONCEPT:Compra Nibiru Home}
