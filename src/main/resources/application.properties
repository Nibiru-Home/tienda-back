spring.application.name=nibiru-home

spring.datasource.url=jdbc:mariadb://localhost:3306/nibiru-home
spring.datasource.username=nibiruHome
spring.datasource.password=nibiruHome
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=none

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
spring.mvc.async.request-timeout=0
